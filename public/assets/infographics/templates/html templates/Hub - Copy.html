<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Standardized Hub Spoke</title>
    <style>
        :root {
            --bg-color: #FAF9F6;
            --accent-teal: #5B9A8B;
            --text-navy: #1A365D;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 1200px;
            background-color: var(--bg-color);
            font-family: 'Inter', system-ui, sans-serif;
            overflow: hidden;
        }

        #canvas {
            position: relative;
            width: 1200px;
            height: 1200px;
        }

        /* 1. THE HUB (Center Point) */
        #hub-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            background: white;
            border: 12px solid var(--accent-teal);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
        }

        /* 2. THE SPOKES (Anchor Containers) */
        .spoke-anchor {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 50;
        }

        .icon-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid white;
            overflow: hidden;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            background: #eee;
            margin-bottom: -15px;
            z-index: 2;
        }

        .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px 15px 15px 15px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
        }

        h2 {
            color: var(--text-navy);
            margin: 0 0 5px 0;
            font-size: 1.25rem;
        }

        p {
            color: #4A5568;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>

<body>

    <div id="canvas">
        <div id="hub-center">
            <h1 id="hub-title" style="margin:0; font-size: 2rem; color: var(--text-navy);">TITLE</h1>
            <p id="hub-desc" style="padding: 0 20px;">Description goes here.</p>
        </div>
        <div id="spokes-container"></div>
    </div>

    <script>
        /**
         * TOUCH POINT 1: GLOBAL CONFIG
         * Change these to adjust the "physics" of the infographic.
         */
        const CONFIG = {
            centerX: 600,
            centerY: 600,
            radius: 420 // Distance from center to spokes
        };

        /**
         * TOUCH POINT 2: DATA INJECTION
         * This is where you paste your JSON payload.
         */
        const DATA_PAYLOAD = /* INSERT_JSON_HERE */ null;

        /**
         * TOUCH POINT 3: RENDER ENGINE
         * The math that turns JSON into pixels.
         */
        function render(data) {
            if (!data) return;

            // Update Center
            document.getElementById('hub-title').innerText = data.center.title;
            document.getElementById('hub-desc').innerText = data.center.description;

            const container = document.getElementById('spokes-container');
            const items = data.items;
            const total = items.length;

            items.forEach((item, index) => {
                // Calculation: Polar to Cartesian
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = CONFIG.centerX + CONFIG.radius * Math.cos(angle);
                const y = CONFIG.centerY + CONFIG.radius * Math.sin(angle);

                const anchor = document.createElement('div');
                anchor.className = 'spoke-anchor';
                anchor.style.left = `${x}px`;
                anchor.style.top = `${y}px`;

                anchor.innerHTML = `
                    <div class="icon-circle">
                        <img src="${item.image_url}" alt="">
                    </div>
                    <div class="content-card">
                        <h2>${item.title}</h2>
                        <p>${item.description}</p>
                    </div>
                `;
                container.appendChild(anchor);
            });
        }

        // Initialize
        if (DATA_PAYLOAD) {
            try {
                render(DATA_PAYLOAD);
            } catch (error) {
                console.error("Render Engine Failed:", error);
            }
        } else {
            console.error("No data payload found. Please inject JSON.");
        }
    </script>
</body>

</html>
