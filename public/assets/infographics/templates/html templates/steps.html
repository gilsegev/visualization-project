<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Standardized Step Journey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-accent: #f8fafc;
            --text-main: #1e293b;
            --text-dim: #64748b;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 1200px;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: var(--bg-accent);
        }

        /* FULL PAGE BACKGROUND LAYER */
        #page-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            /* Semi-transparent requirement */
            z-index: 1;
        }

        #canvas {
            position: relative;
            width: 1200px;
            height: 1200px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px;
        }

        /* GLASS CARD THEME */
        .step-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 35px;
            border: 2.5px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .image-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* PROGRESSION LINE */
        .connector-line {
            position: absolute;
            top: 280px;
            left: 100px;
            right: 100px;
            height: 4px;
            background: rgba(0, 0, 0, 0.05);
            z-index: 5;
        }
    </style>
</head>

<body>

    <div id="page-bg"></div>

    <div id="canvas">
        <div class="text-center mb-16">
            <h2 id="main-title" class="text-[32px] font-black text-slate-800 tracking-[0.15em] mb-4 uppercase">JOURNEY
                TITLE</h2>
            <div id="subtitle" class="text-slate-500 font-medium uppercase tracking-widest text-sm">SUBTITLE TEXT</div>
        </div>

        <div class="relative w-full flex justify-between items-start" id="steps-container">
            <div class="connector-line"></div>
        </div>
    </div>

    <script>
        /**
         * TOUCH POINT 2: DATA INJECTION
         */
        const DATA_PAYLOAD = /* INSERT_JSON_HERE */ null;

        /**
         * TOUCH POINT 3: RENDER ENGINE
         */
        function render(data) {
            if (!data) return;

            // 1. Setup Environment
            if (data.background_url) {
                document.getElementById('page-bg').style.backgroundImage = `url('${data.background_url}')`;
            }

            document.getElementById('main-title').innerText = data.center.title;
            document.getElementById('subtitle').innerText = data.center.subtitle || "";

            const container = document.getElementById('steps-container');
            // Keep the connector line, clear the rest
            const line = container.querySelector('.connector-line');
            container.innerHTML = '';
            container.appendChild(line);

            const items = data.items;
            const colors = ['#004b6b', '#00abe6', '#f8a41b', '#00a585', '#99cc33'];

            items.forEach((item, index) => {
                const color = colors[index % colors.length];
                const stepWrapper = document.createElement('div');
                stepWrapper.className = "relative flex flex-col items-center w-[220px] z-20";

                stepWrapper.innerHTML = `
                    <div class="step-card w-full h-[400px] flex flex-col items-center px-5 py-10" style="border-color: ${color}">
                        <div class="image-placeholder mb-6">
                            <img src="${item.image_url}" alt="">
                        </div>
                        <div class="text-xs font-black mb-4 px-3 py-1 rounded-full text-white uppercase tracking-tighter" style="background-color: ${color}">
                            Step 0${index + 1}
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-3 text-center">${item.title}</h3>
                        <p class="text-slate-500 text-[12px] leading-relaxed text-center font-medium">${item.description}</p>
                    </div>
                `;
                container.appendChild(stepWrapper);

                // Add Arrow if not the last item
                if (index < items.length - 1) {
                    const arrow = document.createElement('div');
                    arrow.className = "flex items-center justify-center -mx-4 z-10 opacity-60";
                    arrow.innerHTML = `
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    `;
                    // Push it down to align with the "center" of visual mass (adjust 'mt' as needed if cards shift)
                    arrow.style.marginTop = "0px";
                    container.appendChild(arrow);
                }
            });
        }

        if (DATA_PAYLOAD) {
            try { render(DATA_PAYLOAD); } catch (e) { console.error("Step Render Failed", e); }
        }
    </script>
</body>

</html>
