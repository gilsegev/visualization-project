<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Radiant Hub</title>
    <style>
        :root {
            /* Theme Variables - Overridden by backend injection */
            --bg-primary: radial-gradient(circle at center, #FAF9F6 0%, #F2F0E9 100%);
            --accent-primary: #5B9A8B;
            --accent-secondary: #E8A598;
            --text-primary: #1A365D;
            --text-secondary: #4A5568;
            --font-main: 'Inter', system-ui, sans-serif;
            --font-size-heading: 2.2rem;
            --font-size-body: 1.1rem;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 1200px;
            background: var(--bg-primary);
            font-family: var(--font-main);
            color: var(--text-primary);
            overflow: hidden;
        }

        #canvas {
            position: relative;
            width: 1200px;
            height: 1200px;
        }

        /* THE HALO: Visual connection orbit */
        .halo-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            border: 2px dashed var(--accent-secondary);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 5;
        }

        /* 1. THE HUB (Center Point) */
        #hub-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            background: white;
            border: 10px solid white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 100;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .hub-image-overlay {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(26, 54, 93, 0.1);
            opacity: 1.0;
            z-index: 1;
            border-radius: 50%;
        }

        #hub-center .content {
            z-index: 2;
            color: var(--text-primary);
            padding: 30px;
        }

        /* 2. THE SPOKES */
        .spoke-anchor {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 50;
        }

        .icon-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            overflow: hidden;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
            z-index: 2;
            margin-bottom: -15px;
        }

        .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 30px 20px 20px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
        }

        h2 {
            color: var(--text-primary);
            margin: 0 0 8px 0;
            font-size: var(--font-size-heading);
            font-weight: 700;
        }

        p {
            color: var(--text-secondary);
            opacity: 0.9;
            margin: 0;
            font-size: var(--font-size-body);
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div id="canvas">
        <div class="halo-orbit"></div>
        <div id="hub-center">
            <div id="hub-image" class="hub-image-overlay"></div>
            <div class="content">
                <h1 id="hub-title" style="margin:0; font-size: 2.2rem;">TITLE</h1>
                <p id="hub-desc" style="font-size: 1.1rem; opacity: 0.9;">Description</p>
            </div>
        </div>
        <div id="spokes-container"></div>
    </div>

    <script>
        const CONFIG = { centerX: 600, centerY: 600, radius: 400 };
        const DATA_PAYLOAD = /* INSERT_JSON_HERE */ null;

        function render(data) {
            if (!data) return;
            document.getElementById('hub-title').innerText = data.center.title;
            document.getElementById('hub-desc').innerText = data.center.description;

            // UX: Inject Hub Background Image
            if (data.center.image_url) {
                document.getElementById('hub-image').style.backgroundImage = `url('${data.center.image_url}')`;
            }

            const container = document.getElementById('spokes-container');
            const total = data.items.length;

            data.items.forEach((item, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = CONFIG.centerX + CONFIG.radius * Math.cos(angle);
                const y = CONFIG.centerY + CONFIG.radius * Math.sin(angle);

                const anchor = document.createElement('div');
                anchor.className = 'spoke-anchor';
                anchor.style.left = `${x}px`; anchor.style.top = `${y}px`;

                anchor.innerHTML = `
                    <div class="icon-circle"><img src="${item.image_url}"></div>
                    <div class="content-card">
                        <h2>${item.title}</h2>
                        <p>${item.description}</p>
                    </div>`;
                container.appendChild(anchor);
            });
        }
        if (DATA_PAYLOAD) render(DATA_PAYLOAD);
    </script>
</body>

</html>
