<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Radiant Hub</title>
    <style>
        :root {
            /* Theme Variables - Overridden by backend injection */
            --bg-primary: radial-gradient(circle at center, #FAF9F6 0%, #F2F0E9 100%);
            --accent-primary: #5B9A8B;
            --accent-secondary: #E8A598;
            --text-primary: #1A365D;
            --text-secondary: #4A5568;
            --font-main: 'Inter', system-ui, sans-serif;
            --font-size-heading: 2.2rem;
            --font-size-body: 1.1rem;
            --glass-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 1200px;
            background: var(--bg-primary);
            font-family: var(--font-main);
            color: var(--text-primary);
            overflow: hidden;
        }

        #canvas {
            position: relative;
            width: 1200px;
            height: 1200px;
        }

        .canvas-background {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 0;
            pointer-events: none;
        }

        /* THE HALO: Visual connection orbit */
        .halo-orbit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            border: 2px dashed var(--accent-secondary);
            opacity: 0.15;
            border-radius: 50%;
            z-index: 5;
        }

        /* 1. THE HUB (Center Point) */
        #hub-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px;
            height: 340px;
            background: white;
            border: 10px solid white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 100;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .hub-image-overlay {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: rgba(26, 54, 93, 0.1);
            opacity: 1.0;
            z-index: 1;
            border-radius: 50%;
        }

        #hub-center .content {
            z-index: 2;
            color: var(--text-primary);
            padding: 30px;
        }

        /* 2. THE SPOKES */
        .spoke-anchor {
            position: absolute;
            transform: translate(-50%, -50%);
            width: var(--spoke-card-width, 280px);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            z-index: 50;
        }

        .icon-circle {
            width: var(--spoke-icon-size, 120px);
            height: var(--spoke-icon-size, 120px);
            border-radius: 50%;
            border: 5px solid white;
            overflow: hidden;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.08);
            z-index: 2;
            margin-bottom: -15px;
        }

        .icon-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: var(--spoke-card-padding-top, 30px) 20px 20px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
        }

        .spoke-anchor h2 {
            font-size: var(--spoke-title-size, 2.2rem);
            line-height: var(--spoke-title-line-height, 1.05);
        }

        .spoke-anchor p {
            font-size: var(--spoke-body-size, 1.1rem);
            line-height: var(--spoke-body-line-height, 1.35);
        }

        h2 {
            color: var(--text-primary);
            margin: 0 0 8px 0;
            font-size: var(--font-size-heading);
            font-weight: 700;
        }

        p {
            color: var(--text-secondary);
            opacity: 0.9;
            margin: 0;
            font-size: var(--font-size-body);
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div id="canvas">
        <div id="canvas-bg" class="canvas-background"></div>
        <div class="halo-orbit"></div>
        <div id="hub-center">
            <div id="hub-image" class="hub-image-overlay"></div>
            <div class="content">
                <h1 id="hub-title" style="margin:0; font-size: 2.2rem;">TITLE</h1>
                <p id="hub-desc" style="font-size: 1.1rem; opacity: 0.9;">Description</p>
            </div>
        </div>
        <div id="spokes-container"></div>
    </div>

    <script>
        const CONFIG = { centerX: 600, centerY: 600, radius: 400 };
        const DATA_PAYLOAD = /* INSERT_JSON_HERE */ null;

        function getLayout(total) {
            if (total <= 5) {
                return {
                    radius: CONFIG.radius,
                    cardWidth: 280,
                    iconSize: 120,
                    titleSize: '2.1rem',
                    bodySize: '1.05rem',
                    bodyLineHeight: '1.4',
                    titleLineHeight: '1.08',
                    paddingTop: '30px',
                    compactMode: false
                };
            }
            if (total <= 8) {
                return {
                    radius: 410,
                    cardWidth: 250,
                    iconSize: 106,
                    titleSize: '1.95rem',
                    bodySize: '1rem',
                    bodyLineHeight: '1.35',
                    titleLineHeight: '1.06',
                    paddingTop: '28px',
                    compactMode: false
                };
            }
            if (total <= 10) {
                return {
                    radius: 420,
                    cardWidth: 226,
                    iconSize: 94,
                    titleSize: '1.72rem',
                    bodySize: '0.9rem',
                    bodyLineHeight: '1.28',
                    titleLineHeight: '1.02',
                    paddingTop: '24px',
                    compactMode: true
                };
            }
            return {
                radius: 430,
                cardWidth: 206,
                iconSize: 84,
                titleSize: '1.56rem',
                bodySize: '0.82rem',
                bodyLineHeight: '1.22',
                titleLineHeight: '1.0',
                paddingTop: '22px',
                compactMode: true
            };
        }

        function applyLayout(layout) {
            const root = document.documentElement;
            root.style.setProperty('--spoke-card-width', `${layout.cardWidth}px`);
            root.style.setProperty('--spoke-icon-size', `${layout.iconSize}px`);
            root.style.setProperty('--spoke-title-size', layout.titleSize);
            root.style.setProperty('--spoke-body-size', layout.bodySize);
            root.style.setProperty('--spoke-body-line-height', layout.bodyLineHeight);
            root.style.setProperty('--spoke-title-line-height', layout.titleLineHeight);
            root.style.setProperty('--spoke-card-padding-top', layout.paddingTop);
        }

        function intersects(a, b, padding = 8) {
            return !(
                a.right - padding < b.left + padding ||
                a.left + padding > b.right - padding ||
                a.bottom - padding < b.top + padding ||
                a.top + padding > b.bottom - padding
            );
        }

        function render(data) {
            if (!data) return;
            document.getElementById('hub-title').innerText = data.center.title;
            document.getElementById('hub-desc').innerText = data.center.description;

            // UX: Inject Hub Background Image
            if (data.center.image_url) {
                document.getElementById('hub-image').style.backgroundImage = `url('${data.center.image_url}')`;
            }
            if (data.background_url) {
                document.getElementById('canvas-bg').style.backgroundImage = `url('${data.background_url}')`;
            }

            const container = document.getElementById('spokes-container');
            const total = data.items.length;
            const layout = getLayout(total);
            applyLayout(layout);
            const spokes = [];

            data.items.forEach((item, index) => {
                const baseAngle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const angleNudge = layout.compactMode ? (index % 2 === 0 ? -0.035 : 0.035) : 0;
                const angle = baseAngle + angleNudge;
                const radialOffset = layout.compactMode ? (index % 2 === 0 ? -26 : 20) : 0;
                const radius = layout.radius + radialOffset;
                const x = CONFIG.centerX + radius * Math.cos(angle);
                const y = CONFIG.centerY + radius * Math.sin(angle);

                const anchor = document.createElement('div');
                anchor.className = 'spoke-anchor';
                anchor.style.left = `${x}px`; anchor.style.top = `${y}px`;
                // Layering rule (counter-clockwise precedence):
                // - Each item is placed behind the item immediately before it when moving counter-clockwise.
                // - This means clockwise neighbors stack "under" their CCW neighbor.
                // - Background remains at z-index 0 and never blocks content.
                // Mapping for N items:
                // index N-1 is highest, then 0, 1, 2 ... N-2
                const z = total - ((index + 1) % total);
                anchor.style.zIndex = `${z}`;

                anchor.innerHTML = `
                    <div class="icon-circle"><img src="${item.image_url}"></div>
                    <div class="content-card">
                        <h2>${item.title}</h2>
                        <p>${item.description}</p>
                    </div>`;
                container.appendChild(anchor);
                spokes.push({ anchor, angle, radius });
            });

            if (layout.compactMode) {
                const maxIterations = 24;
                const pushStep = 8;
                for (let iter = 0; iter < maxIterations; iter++) {
                    let moved = false;
                    for (let i = 0; i < spokes.length; i++) {
                        const aRect = spokes[i].anchor.querySelector('.content-card').getBoundingClientRect();
                        for (let j = i + 1; j < spokes.length; j++) {
                            const bRect = spokes[j].anchor.querySelector('.content-card').getBoundingClientRect();
                            if (!intersects(aRect, bRect, 10)) continue;
                            moved = true;
                            // Push the clockwise item further from center first.
                            const target = spokes[j];
                            target.radius = Math.min(target.radius + pushStep, 500);
                            const x = CONFIG.centerX + target.radius * Math.cos(target.angle);
                            const y = CONFIG.centerY + target.radius * Math.sin(target.angle);
                            target.anchor.style.left = `${x}px`;
                            target.anchor.style.top = `${y}px`;
                        }
                    }
                    if (!moved) break;
                }
            }
            if (layout.compactMode && spokes.length > 10) {
                // Secondary pass for 11+ spokes: mild clockwise angular spread.
                const spread = 0.012;
                spokes.forEach((spoke, idx) => {
                    const shift = (idx - (spokes.length - 1) / 2) * spread;
                    const angle = spoke.angle + shift;
                    const x = CONFIG.centerX + spoke.radius * Math.cos(angle);
                    const y = CONFIG.centerY + spoke.radius * Math.sin(angle);
                    spoke.anchor.style.left = `${x}px`;
                    spoke.anchor.style.top = `${y}px`;
                });
            }
            if (layout.compactMode) {
                // Final safety: push cards that still intersect hub boundary slightly outward.
                const hubRect = document.getElementById('hub-center').getBoundingClientRect();
                spokes.forEach((spoke) => {
                    const card = spoke.anchor.querySelector('.content-card');
                    const rect = card.getBoundingClientRect();
                    if (!intersects(rect, hubRect, -6)) return;
                    spoke.radius = Math.min(spoke.radius + 16, 500);
                    const x = CONFIG.centerX + spoke.radius * Math.cos(spoke.angle);
                    const y = CONFIG.centerY + spoke.radius * Math.sin(spoke.angle);
                    spoke.anchor.style.left = `${x}px`;
                    spoke.anchor.style.top = `${y}px`;
                });
            });
        }
        if (DATA_PAYLOAD) render(DATA_PAYLOAD);
    </script>
</body>

</html>
