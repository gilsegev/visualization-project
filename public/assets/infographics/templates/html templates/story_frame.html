<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1400, initial-scale=1.0">
    <title>Story Frame</title>
    <style>
        :root {
            --bg-primary: #FAF9F6;
            --accent-primary: #5B9A8B;
            --accent-secondary: #E8A598;
            --text-primary: #1A365D;
            --font-main: 'Inter', sans-serif;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: var(--font-main);
        }

        #canvas {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
        }

        /* Wellness-book inspired frame treatment */
        .story-border {
            position: absolute;
            inset: 18px;
            border: 2px solid color-mix(in srgb, var(--accent-primary) 55%, white);
            border-radius: 18px;
            pointer-events: none;
            z-index: 3;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.08),
                inset 0 0 0 1px color-mix(in srgb, var(--accent-secondary) 30%, white);
        }

        #story-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
            filter: saturate(0.98) contrast(1.01);
        }

        .vignette {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            background:
                radial-gradient(circle at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.08) 100%);
        }
    </style>
</head>
<body>
    <div id="canvas">
        <img id="story-image" alt="" />
        <div class="vignette"></div>
        <div class="story-border"></div>
    </div>

    <script>
        const DATA_PAYLOAD = /* INSERT_JSON_HERE */ null;
        if (DATA_PAYLOAD && DATA_PAYLOAD.image_url) {
            document.getElementById('story-image').src = DATA_PAYLOAD.image_url;
        }
    </script>
</body>
</html>
