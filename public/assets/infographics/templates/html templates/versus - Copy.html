<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Versus Split</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>
        :root {
            /* Theme Variables - Overridden by backend injection */
            --bg-primary: #FFFFFF;
            --accent-primary: #FFD100;
            --accent-secondary: #E11B22;
            --text-primary: #1A1A1A;
            --text-secondary: #4A5568;
            --font-main: 'Inter', sans-serif;
            --font-size-heading: 1.5rem;
            --font-size-body: 1rem;
            --glass-bg: rgba(255, 255, 255, 0.85);

            --white: #FFFFFF;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 1200px;
            background: var(--bg-primary);
            font-family: var(--font-main);
            color: var(--text-primary);
            overflow: hidden;
            border: 8px solid var(--text-primary);
            box-sizing: border-box;
        }

        #canvas {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* HEADER SECTION */
        header {
            background: var(--accent-primary);
            border-bottom: 6px solid var(--text-primary);
            padding: 40px;
            text-align: center;
            position: relative;
        }

        .prefix {
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
            font-size: var(--font-size-body);
        }

        .main-title {
            font-size: calc(var(--font-size-heading) * 1.5);
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .subjects-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
        }

        .subject {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 350px;
        }

        .subject-img {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            border: 4px solid var(--text-primary);
            background: white;
            box-shadow: 10px 10px 0 var(--text-primary);
            overflow: hidden;
        }

        .subject-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .subject-label {
            font-size: var(--font-size-heading);
            font-weight: 900;
            color: var(--text-primary);
            text-transform: uppercase;
        }

        .vs-badge {
            width: 80px;
            height: 80px;
            background: var(--text-primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            border: 4px solid var(--white);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* BODY / ROWS SECTION */
        main {
            flex: 1;
            position: relative;
            background: var(--white);
        }

        main::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--text-primary);
            transform: translateX(-50%);
            z-index: 1;
        }

        #rows-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .compare-row {
            display: grid;
            grid-template-columns: 1fr 120px 1fr;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
            flex: 1;
        }

        .side-cell {
            padding: 25px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-side {
            text-align: right;
            align-items: flex-end;
            background: rgba(0, 0, 0, 0.02);
        }

        .right-side {
            text-align: left;
            align-items: flex-start;
            background: rgba(0, 0, 0, 0.04);
        }

        .col-title {
            font-size: var(--font-size-heading);
            font-weight: 800;
            color: var(--accent-primary);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .right-side .col-title {
            color: var(--accent-secondary);
        }

        .col-desc {
            font-size: var(--font-size-body);
            line-height: 1.5;
            color: var(--text-secondary);
            max-width: 400px;
        }

        .center-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
        }

        .row-icon {
            width: 56px;
            height: 56px;
            background: var(--accent-primary);
            border: 4px solid var(--text-primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(3deg);
            overflow: hidden;
            /* Ensure image fits shape */
        }

        .row-icon .material-symbols-outlined {
            font-size: 32px;
            color: var(--text-primary);
            font-variation-settings: 'FILL' 1;
        }

        .icon-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: multiply;
            /* Make white transparent */
        }

        /* FOOTER */
        footer {
            background: var(--text-primary);
            color: var(--accent-primary);
            padding: 30px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .verdict-title {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .verdict-text {
            font-size: 14px;
            opacity: 0.8;
            max-width: 600px;
        }

        .cta {
            background: var(--accent-primary);
            color: var(--text-primary);
            padding: 12px 24px;
            font-weight: 900;
            transform: rotate(-2deg);
        }
    </style>
</head>

<body>

    <div id="canvas">
        <header>
            <div class="prefix" id="prefix-text">THE MODERN DEBATE</div>
            <div class="main-title" id="main-title">TITLE</div>
            <div class="subjects-row">
                <div class="subject">
                    <div class="subject-img"><img id="left-img" src=""></div>
                    <div class="subject-label" id="left-name">SUBJECT A</div>
                </div>
                <div class="vs-badge">VS</div>
                <div class="subject">
                    <div class="subject-img"><img id="right-img" src=""></div>
                    <div class="subject-label" id="right-name">SUBJECT B</div>
                </div>
            </div>
        </header>

        <main id="rows-container"></main>

        <footer>
            <div>
                <div class="verdict-title" id="verdict-title">THE VERDICT</div>
                <div class="verdict-text" id="verdict-text">Conclusion text goes here.</div>
            </div>
            <div class="cta">CHOOSE WISELY</div>
        </footer>
    </div>

    <script>
        const DATA_PAYLOAD = /* INSERT_JSON_HERE */ null;

        function render(data) {
            if (!data) return;

            // 1. Render Header
            document.getElementById('main-title').innerText = data.center.title;
            document.getElementById('prefix-text').innerText = data.center.subtitle || "THE MODERN DEBATE";

            document.getElementById('left-name').innerText = data.subjects[0].name;
            document.getElementById('left-img').src = data.subjects[0].image_url;

            document.getElementById('right-name').innerText = data.subjects[1].name;
            document.getElementById('right-img').src = data.subjects[1].image_url;

            // 2. Render Rows
            const container = document.getElementById('rows-container');
            container.innerHTML = '';

            data.items.forEach(item => {
                const row = document.createElement('div');
                row.className = 'compare-row';
                row.innerHTML = `
                    <div class="side-cell left-side">
                        <div class="col-title">${item.left.value}</div>
                        <div class="col-desc">${item.left.description}</div>
                    </div>
                    <div class="center-cell">
                        <div class="row-icon">
                            ${item.icon_url
                        ? `<img src="${item.icon_url}" class="icon-img" alt="vs">`
                        : `<span class="material-symbols-outlined">${item.icon || 'star'}</span>`
                    }
                        </div>
                    </div>
                    <div class="side-cell right-side">
                        <div class="col-title">${item.right.value}</div>
                        <div class="col-desc">${item.right.description}</div>
                    </div>
                `;
                container.appendChild(row);
            });

            // 3. Render Footer
            if (data.verdict) {
                document.getElementById('verdict-title').innerText = data.verdict.title;
                document.getElementById('verdict-text').innerText = data.verdict.text;
            }
        }

        if (DATA_PAYLOAD) {
            try {
                render(DATA_PAYLOAD);
                // Dynamic Scaling to Fit
                setTimeout(scaleToFit, 50);
                window.addEventListener('resize', scaleToFit);
            } catch (e) {
                console.error("Versus Render Failed:", e);
            }
        }

        function scaleToFit() {
            const canvas = document.getElementById('canvas');
            if (!canvas) return;

            // Reset to measure
            canvas.style.transform = 'none';
            canvas.style.height = 'auto'; // Allow it to grow to measure

            const actualHeight = canvas.scrollHeight;
            const availableHeight = 1180; // 1200 - borders/padding safety

            if (actualHeight > availableHeight) {
                const scale = availableHeight / actualHeight;
                // Apply scale to a wrapper or the body? 
                // Transforming the flex container might effectively shrink it.
                // We need to set transform origin top center
                canvas.style.transformOrigin = 'top center';
                canvas.style.transform = `scale(${scale})`;

                // Centering vertically if we scaled down? No, usually it's just to fit.
                // But wait, if we scale down, we leave empty space at bottom? No, we are fitting TO the container.
                // If we set height: 100% again it might clip.
            }

            // Restore 100% height constraint for layout
            canvas.style.height = '100%';

            // Actually, a better approach for flex scaling:
            // If we simply zoom the body?
            // Let's rely on standard "Fit to container":
            // If Height > 1200, scale = 1200 / Height.
            // We apply this scale to #canvas. 
            // And we must ensure #canvas width is also managed.
        }
    </script>
</body>

</html>
