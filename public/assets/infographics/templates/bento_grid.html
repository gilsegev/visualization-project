<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    .bento-card {
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .bento-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>

<body class="bg-[#fcfcfd] p-16 flex flex-col items-center min-h-screen">

  <div class="max-w-6xl w-full">

    <div class="mb-16 text-center">
      <h1 id="main-topic" class="text-4xl font-900 text-slate-900 tracking-tight uppercase mb-4">Core Components</h1>
      <div class="h-1 w-20 bg-blue-600 mx-auto rounded-full" style="background-color: var(--theme-accent);"></div>
    </div>

    <div id="item-wrapper" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

      <div class="bento-item bento-card p-8 rounded-[2rem] flex flex-col gap-6 shadow-sm">
        <div class="w-full h-48 rounded-2xl overflow-hidden bg-slate-50 border border-slate-100">
          <img id="slot_img_0" class="w-full h-full object-cover" style="mix-blend-mode: multiply;">
        </div>

        <div class="flex flex-col gap-2">
          <div class="w-8 h-1 bg-blue-600 mb-2 rounded-full" style="background-color: var(--theme-accent);"></div>
          <h2 id="slot_title_0" class="text-xl font-bold text-slate-800 tracking-tight">Feature Name</h2>
          <p id="slot_txt_0" class="text-slate-500 text-sm leading-relaxed">
            The description goes here. In a bento grid, we keep this concise but descriptive enough to provide value.
          </p>
        </div>
      </div>

    </div>
  </div>

</body>

</html>
