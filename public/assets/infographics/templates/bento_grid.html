<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --theme-accent: #3B82F6;
      --bg-page: #F8FAFC;
      --text-main: #0f172a;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 1200px;
      height: 1200px;
      overflow: hidden;
      background: var(--bg-page);
      font-family: 'Inter', sans-serif;
    }

    #main-wrapper {
      position: relative;
      width: 1200px;
      height: 1200px;
    }

    .header-box {
      position: absolute;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      width: 800px;
    }

    /* 📦 Absolute Card Anchors */
    .bento-card {
      position: absolute;
      width: 360px;
      height: 480px;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.06);
      border-radius: 2.5rem;
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      transform: translate(-50%, -50%);
    }

    /* 🎯 Direct Logic: (200, 600), (600, 600), (1000, 600) */
    .card-0 {
      left: 200px;
      top: 600px;
    }

    .card-1 {
      left: 600px;
      top: 600px;
    }

    .card-2 {
      left: 1000px;
      top: 600px;
    }

    .img-container {
      width: 100%;
      height: 220px;
      background: #f1f5f9;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid #f1f5f9;
    }

    .img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .accent-bar {
      width: 60px;
      height: 4px;
      background: var(--theme-accent);
      border-radius: 999px;
    }
  </style>
</head>

<body>

  <div id="main-wrapper">
    <div class="header-box">
      <h1 id="main-topic" class="text-5xl font-black text-slate-900 uppercase tracking-tighter mb-4">Core Components
      </h1>
      <div class="h-1.5 w-24 bg-blue-600 mx-auto rounded-full" style="background-color: var(--theme-accent);"></div>
    </div>

    <!-- CARDS WILL BE INJECTED HERE -->
    <div id="item-wrapper">
      <div class="bento-card card-0">
        <div class="img-container">
          <img id="slot_img_0" src="https://via.placeholder.com/400" alt="">
        </div>
        <div class="accent-bar"></div>
        <h2 id="slot_title_0" class="text-2xl font-bold text-slate-800">Feature One</h2>
        <p id="slot_txt_0" class="text-slate-500 text-sm leading-relaxed">
          Concise description locked into a deterministic box.
        </p>
      </div>
    </div>
  </div>

</body>

</html>
