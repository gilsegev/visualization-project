<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --theme-accent: #3B82F6;
            --bg-page: #0f172a;
            --text-main: #f8fafc;
        }

        /* 🔒 Deterministic canvas */
        html,
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 1200px;
            overflow: hidden;
            background: var(--bg-page);
            font-family: 'Inter', sans-serif;
        }

        #main-wrapper {
            position: relative;
            width: 1200px;
            height: 1200px;
        }

        /* ⚔️ The Split Background */
        .bg-split {
            position: absolute;
            inset: 0;
            display: flex;
        }

        .bg-left,
        .bg-right {
            width: 600px;
            height: 1200px;
            position: relative;
            overflow: hidden;
        }

        .bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.2;
        }

        .gradient-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.4), rgba(15, 23, 42, 0.9));
            z-index: 5;
        }

        /* ⚓ THE MAGNET ANCHOR */
        #item-wrapper {
            position: absolute;
            top: 50%;
            left: 0;
            width: 1200px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        #stat_rows_container {
            width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stat-row {
            display: grid;
            grid-template-columns: 1fr 180px 1fr;
            align-items: center;
            gap: 1rem;
            width: 100%;
        }

        .val-text {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .left-align {
            text-align: right;
        }

        .right-align {
            text-align: left;
        }

        .label-pill {
            text-align: center;
            font-size: 0.75rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--theme-accent);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid var(--theme-accent);
        }

        .subject-titles {
            position: absolute;
            top: 100px;
            width: 1200px;
            display: flex;
            justify-content: space-around;
            z-index: 30;
        }

        .subject-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            color: white;
            text-align: center;
            width: 450px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .vs-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            font-weight: 900;
            font-style: italic;
            color: rgba(255, 255, 255, 0.05);
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div id="main-wrapper">
        <div class="bg-split">
            <div class="bg-left"><img id="slot_image_left" class="bg-img"></div>
            <div class="bg-right"><img id="slot_image_right" class="bg-img"></div>
        </div>
        <div class="gradient-overlay"></div>
        <div class="vs-badge">VS</div>

        <div class="subject-titles">
            <h2 id="slot_title_left" class="subject-title">Subject A</h2>
            <h2 id="slot_title_right" class="subject-title">Subject B</h2>
        </div>

        <div id="item-wrapper">
            <div id="stat_rows_container">
                <!-- Rows injected here -->
            </div>
        </div>
    </div>
</body>

</html>
