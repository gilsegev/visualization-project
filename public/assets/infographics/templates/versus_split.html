<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    body {
      font-family: 'Inter', sans-serif;
    }

    .vs-text-glow {
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 40px var(--theme-accent);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center overflow-hidden relative"
  style="background-color: var(--bg-page); color: var(--text-main);">

  <!-- Background Split -->
  <div class="absolute inset-0 flex z-0">
    <div class="w-1/2 h-full relative overflow-hidden" style="background-color: var(--bg-page);">
      <div class="absolute inset-0 z-10"
        style="background: linear-gradient(to right, transparent, var(--bg-page)); opacity: 0.9;"></div>
      <img id="slot_image_left" class="absolute inset-0 w-full h-full object-contain opacity-80 p-12">
    </div>
    <div class="w-1/2 h-full relative overflow-hidden" style="background-color: var(--bg-page);">
      <div class="absolute inset-0 z-10"
        style="background: linear-gradient(to left, transparent, var(--bg-page)); opacity: 0.9;"></div>
      <img id="slot_image_right" class="absolute inset-0 w-full h-full object-contain opacity-80 p-12">
    </div>
  </div>

  <!-- Content Container -->
  <div class="relative z-10 w-full max-w-5xl flex flex-col items-center">

    <!-- VS Badge -->
    <div class="mb-12 relative flex items-center justify-center">
      <div class="absolute inset-0 rounded-full blur-xl opacity-50 bg-blue-500"
        style="background-color: var(--theme-accent);"></div>
      <h1 class="text-8xl font-black italic vs-text-glow relative z-10 tracking-tighter">VS</h1>
    </div>

    <!-- Comparison Grid -->
    <div class="w-full grid grid-cols-3 gap-8 items-center text-center">

      <!-- Left Subject Title -->
      <div class="col-span-1 text-right">
        <h2 id="slot_title_left" class="text-4xl font-bold uppercase tracking-wide" style="color: var(--text-main);">
          Subject A</h2>
      </div>

      <!-- Spine Header -->
      <div class="col-span-1"></div>

      <!-- Right Subject Title -->
      <div class="col-span-1 text-left">
        <h2 id="slot_title_right" class="text-4xl font-bold uppercase tracking-wide" style="color: var(--text-main);">
          Subject B</h2>
      </div>

    </div>

    <!-- Stats Container -->
    <div id="slot_stats_container" class="w-full mt-12 flex flex-col gap-6">
      <!-- Stat Row Template (Hidden or JS Generated) -->
      <div class="stat-row grid grid-cols-3 gap-8 items-center text-center py-4 border-b border-white/10">
        <div class="text-xl font-bold text-slate-300 text-right">Stats A</div>
        <div
          class="text-sm font-black tracking-widest uppercase text-blue-400 bg-slate-900/50 px-3 py-1 rounded-full mx-auto"
          style="color: var(--theme-accent);">Metric</div>
        <div class="text-xl font-bold text-slate-300 text-left">Stats B</div>
      </div>
    </div>

  </div>

</body>

</html>
