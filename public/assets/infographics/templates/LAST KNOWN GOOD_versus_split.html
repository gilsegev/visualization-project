<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, height=1200">
    <title>Versus Infographic Template</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        #main-wrapper {
            width: 1200px;
            height: 1200px;
            overflow: hidden;
            position: relative;
            background: #0f172a;
        }

        /* Background Images */
        .bg-image {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            background-size: cover;
            background-position: center;
            opacity: 0.3;
        }

        .bg-image-left {
            left: 0;
            /* Default placeholder - will be replaced via injection */
            background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=600&h=1200&fit=crop&q=80');
        }

        .bg-image-right {
            right: 0;
            /* Default placeholder - will be replaced via injection */
            background-image: url('https://images.unsplash.com/photo-1563986768609-322da13575f3?w=600&h=1200&fit=crop&q=80');
        }

        /* Gradient Overlays */
        .gradient-overlay-left {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 50%;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15) 0%, rgba(15, 23, 42, 0.85) 100%);
            pointer-events: none;
        }

        .gradient-overlay-right {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 50%;
            background: linear-gradient(225deg, rgba(56, 113, 255, 0.15) 0%, rgba(15, 23, 42, 0.85) 100%);
            pointer-events: none;
        }

        /* The Spine - Central glowing line */
        .spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg,
                    transparent 0%,
                    rgba(148, 163, 184, 0.3) 15%,
                    rgba(148, 163, 184, 0.6) 50%,
                    rgba(148, 163, 184, 0.3) 85%,
                    transparent 100%);
            transform: translateX(-50%);
            box-shadow: 0 0 20px rgba(148, 163, 184, 0.5);
        }

        /* VS Badge */
        .vs-badge {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.85) 100%);
            border-radius: 50%;
            border: 3px solid rgba(148, 163, 184, 0.4);
            box-shadow:
                0 0 40px rgba(148, 163, 184, 0.3),
                inset 0 2px 20px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: #f1f5f9;
            letter-spacing: 0.1em;
            z-index: 1000;
            backdrop-filter: blur(12px);
            pointer-events: none;
        }

        /* Dynamic Title Scaling */
        .dynamic-title {
            font-size: clamp(3.5rem, 8vw, 5rem);
            line-height: 1.1;
            font-weight: 900;
            letter-spacing: -0.02em;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(30, 41, 59, 0.75);
            border-color: rgba(148, 163, 184, 0.25);
            transform: translateY(-2px);
        }

        /* Shared Axis Grid - The Key Component */
        .stat-row {
            display: grid;
            grid-template-columns: 1fr 240px 1fr;
            gap: 0;
            align-items: center;
            min-height: 80px;
            position: relative;
        }

        .stat-left {
            text-align: right;
            padding-right: 2rem;
        }

        .stat-center {
            text-align: center;
            padding: 0 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-right {
            text-align: left;
            padding-left: 2rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.875rem;
            font-weight: 500;
            opacity: 0.8;
        }

        /* Color Accents */
        .accent-red {
            color: #ef4444;
        }

        .accent-blue {
            color: #3b82f6;
        }

        .border-red {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .border-blue {
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Magnet Anchor - Content grows from center */
        .content-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .header-section {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 2rem;
            align-items: end;
            margin-bottom: 2rem;
        }

        .header-left {
            text-align: right;
            padding-right: 2rem;
        }

        .header-right {
            text-align: left;
            padding-left: 2rem;
        }

        .header-spacer {
            width: 120px;
        }
    </style>
</head>

<body>
    <div id="main-wrapper">
        <!-- Background Images (Dynamic Injection) -->
        <div id="slot_image_left" class="bg-image bg-image-left"></div>
        <div id="slot_image_right" class="bg-image bg-image-right"></div>

        <!-- Gradient Overlays -->
        <div class="gradient-overlay-left"></div>
        <div class="gradient-overlay-right"></div>

        <!-- The Spine -->
        <div class="spine"></div>

        <!-- Content Container (Magnet Anchor) -->
        <div class="content-container">
            <!-- Header Section -->
            <div class="header-section">
                <!-- Left Header -->
                <div class="header-left">
                    <h1 id="slot_title_left" class="dynamic-title accent-red"
                        style="text-shadow: 0 0 30px rgba(239, 68, 68, 0.5);">
                        Red Team
                    </h1>
                    <p class="text-slate-400 text-lg mt-2 font-medium">Offensive Security</p>
                </div>

                <!-- Spacer for VS badge -->
                <div class="header-spacer"></div>

                <!-- Right Header -->
                <div class="header-right">
                    <h1 id="slot_title_right" class="dynamic-title accent-blue"
                        style="text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);">
                        Blue Team
                    </h1>
                    <p class="text-slate-400 text-lg mt-2 font-medium">Defensive Security</p>
                </div>
            </div>

            <!-- Stats Container (Shared Axis Grid) -->
            <div id="stat_rows_container" class="w-full space-y-4" style="position: relative;">
            </div>
            <!-- VS Badge moved outside container to prevent deletion -->
            <div class="vs-badge">VS</div>
            <!-- Example Row 1 -->
            <div class="glass-card stat-row">
                <div class="stat-left">
                    <div class="stat-value accent-red">127</div>
                    <div class="stat-label text-slate-300">Active Exploits</div>
                </div>
                <div class="stat-center">
                    Attack Vectors
                </div>
                <div class="stat-right">
                    <div class="stat-value accent-blue">342</div>
                    <div class="stat-label text-slate-300">Blocked Threats</div>
                </div>
            </div>

            <!-- Example Row 2 -->
            <div class="glass-card stat-row">
                <div class="stat-left">
                    <div class="stat-value accent-red">98.7%</div>
                    <div class="stat-label text-slate-300">Success Rate</div>
                </div>
                <div class="stat-center">
                    Effectiveness
                </div>
                <div class="stat-right">
                    <div class="stat-value accent-blue">99.2%</div>
                    <div class="stat-label text-slate-300">Detection Rate</div>
                </div>
            </div>

            <!-- Example Row 3 -->
            <div class="glass-card stat-row">
                <div class="stat-left">
                    <div class="stat-value accent-red">14</div>
                    <div class="stat-label text-slate-300">Zero-Days Found</div>
                </div>
                <div class="stat-center">
                    Vulnerabilities
                </div>
                <div class="stat-right">
                    <div class="stat-value accent-blue">14</div>
                    <div class="stat-label text-slate-300">Zero-Days Patched</div>
                </div>
            </div>

            <!-- Example Row 4 -->
            <div class="glass-card stat-row">
                <div class="stat-left">
                    <div class="stat-value accent-red">2.3s</div>
                    <div class="stat-label text-slate-300">Average Breach Time</div>
                </div>
                <div class="stat-center">
                    Response Speed
                </div>
                <div class="stat-right">
                    <div class="stat-value accent-blue">1.8s</div>
                    <div class="stat-label text-slate-300">Average Block Time</div>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script>
        // Example injection function for dynamic background images
        function setBackgroundImage(side, imageUrl) {
            const element = document.getElementById(`slot_image_${side}`);
            if (element && imageUrl) {
                element.style.backgroundImage = `url('${imageUrl}')`;
            }
        }

        // Example injection function for titles
        function setTitle(side, title, subtitle) {
            const titleElement = document.getElementById(`slot_title_${side}`);
            if (titleElement && title) {
                titleElement.textContent = title;
            }
            // You can extend this to handle subtitles as well
        }

        // Example injection function for stat rows
        function addStatRow(leftValue, leftLabel, category, rightValue, rightLabel) {
            const container = document.getElementById('stat_rows_container');
            const row = document.createElement('div');
            row.className = 'glass-card stat-row';
            row.innerHTML = `
                <div class="stat-left">
                    <div class="stat-value accent-red">${leftValue}</div>
                    <div class="stat-label text-slate-300">${leftLabel}</div>
                </div>
                <div class="stat-center">
                    ${category}
                </div>
                <div class="stat-right">
                    <div class="stat-value accent-blue">${rightValue}</div>
                    <div class="stat-label text-slate-300">${rightLabel}</div>
                </div>
            `;
            container.appendChild(row);
        }

        // Example: Clear all rows before injecting new ones
        function clearStatRows() {
            const container = document.getElementById('stat_rows_container');
            container.innerHTML = '';
        }

        // Usage example (commented out):
        // clearStatRows();
        // addStatRow('250', 'Attacks Launched', 'Daily Activity', '248', 'Attacks Prevented');
        // setBackgroundImage('left', 'https://example.com/red-team.jpg');
        // setBackgroundImage('right', 'https://example.com/blue-team.jpg');
        // setTitle('left', 'Offensive Team');
        // setTitle('right', 'Defensive Team');
    </script>
</body>

</html>
