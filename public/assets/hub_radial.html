<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --theme-glow: #00f7ff;
      --hub-bg: #0a1128;
      --radius: 300px;
    }

    body {
      background: radial-gradient(circle at center, #1a2c4e 0%, #050a14 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #main-wrapper {
      width: 1200px;
      height: 1200px;
      position: relative;
      overflow: hidden;
    }

    #hub-center {
      z-index: 100;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .hex-clip {
      clip-path: polygon(50% 0%, 95% 25%, 95% 75%, 50% 100%, 5% 75%, 5% 25%);
    }

    .spoke-container {
      padding: 0;
      margin: 0;
    }

    .hub-glow {
      box-shadow: 0 0 40px var(--theme-glow);
      border: 2px solid var(--theme-glow);
    }

    .card-bg {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 247, 255, 0.2);
    }
  </style>
</head>

<body>

  <div id="main-wrapper">
    <div class="relative w-full h-full flex justify-center items-center">

      <div id="hub-center"
        class="w-56 h-56 bg-slate-900 hex-clip flex flex-col justify-center items-center text-center p-6 hub-glow">
        <h2 id="slot_title_center" class="text-2xl font-black text-cyan-400 tracking-tighter leading-none">TOPIC</h2>
        <p id="slot_txt_center" class="text-[10px] uppercase tracking-[0.2em] mt-2 text-slate-400">Description</p>
      </div>

      <div class="absolute inset-0" style="--total: 6;">

        <div class="spoke-container flex flex-col items-center w-56" style="--i: 0;">
          <div class="spoke-icon w-32 h-32 hex-clip bg-cyan-500 p-1 shadow-lg shadow-cyan-500/50">
            <img src="[BASE64_PLACEHOLDER]" class="w-full h-full object-cover hex-clip">
          </div>
          <div class="card-bg mt-4 p-3 rounded-xl text-center">
            <h3 id="slot_title" class="text-cyan-400 font-bold text-sm">Item Title</h3>
            <p id="slot_txt" class="text-[10px] text-slate-300 mt-1 leading-tight">Item description goes here.</p>
          </div>
        </div>

        <div class="spoke-container flex flex-col items-center w-56" style="--i: 1;">
          <div class="spoke-icon w-32 h-32 hex-clip bg-cyan-500 p-1 shadow-lg shadow-cyan-500/50">
            <img src="[BASE64_PLACEHOLDER]" class="w-full h-full object-cover hex-clip">
          </div>
          <div class="card-bg mt-4 p-3 rounded-xl text-center">

            <p class="text-[10px] text-slate-300 mt-1 leading-tight">Item description goes here.</p>
          </div>
        </div>

        <div class="spoke-container flex flex-col items-center w-56" style="--i: 2;">
          <div class="spoke-icon w-32 h-32 hex-clip bg-cyan-500 p-1 shadow-lg shadow-cyan-500/50">
            <img src="[BASE64_PLACEHOLDER]" class="w-full h-full object-cover hex-clip">
          </div>
          <div class="card-bg mt-4 p-3 rounded-xl text-center">

            <p class="text-[10px] text-slate-300 mt-1 leading-tight">Item description goes here.</p>
          </div>
        </div>

        <div class="spoke-container flex flex-col items-center w-56" style="--i: 3;">

          </div>

          </div>
        </div>

        <div class="spoke-container flex flex-col items-center w-56" style="--i: 4;">
          <div class="spoke-icon w-32 h-32 hex-clip bg-cyan-500 p-1 shadow-lg shadow-cyan-500/50">

          </div>

          </div>
        </div>

      </div>
    </div>
</body>

</html>
